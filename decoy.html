<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Service Status</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f7f9;color:#1b1b1b;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;max-width:420px;width:92%;padding:28px;box-shadow:0 8px 24px rgba(0,0,0,.04)}
  h1{font-size:1.25rem;margin:0 0 8px}
  p{margin:0;color:#5b616a;line-height:1.5;font-size:.95rem}
  .ok{display:inline-block;margin-top:16px;padding:6px 10px;border-radius:999px;background:#ecfdf3;color:#067647;font-size:.8rem;font-weight:600}
</style>
</head>
<body>
  <div class="box">
    <h1>Scheduled maintenance</h1>
    <p>Our account portal is temporarily unavailable while we finish a routine systems update. No action is required on your side.</p>
    <div class="ok">All member data remains safe</div>
  </div>
</body>
</html>
